name: Build Android APK
on:
  push:
    branches: [main, 'feat/coordinate-navigation']
    paths-ignore: ['docs/**', '*.md', '.github/workflows/android-smoke.yml', 'tests/android-installed.smoke.cjs']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify mobile save, map marker and persistence in Chromium
        shell: bash
        run: |
          tool_dir="$RUNNER_TEMP/camping-browser"
          npm install --prefix "$tool_dir" --no-audit --no-fund --no-package-lock playwright@1.65.1
          "$tool_dir/node_modules/.bin/playwright" install chromium
          npm run dev -- --host 127.0.0.1 --port 5179 --strictPort > "$RUNNER_TEMP/camping-vite.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for n in {1..20}; do curl -fs http://127.0.0.1:5179 > /dev/null && break; sleep 1; done
          mkdir -p artifacts
          CAMPING_SCREENSHOT="$PWD/artifacts/mobile-list-smoke.png" CAMPING_PLAYWRIGHT="$tool_dir/node_modules/playwright" node tests/save-home.smoke.cjs
      - run: npx cap sync android
      - name: Build test APK and run Android checks
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug lintDebug testDebugUnitTest --no-daemon
      - name: Collect verified APK
        run: |
          mkdir -p artifacts
          code="$(awk '/^[[:space:]]*versionCode [0-9]+$/ { print $2 }' android/app/build.gradle)"
          version="$(awk -F'"' '/^[[:space:]]*versionName "[0-9.]+"/ { print $2 }' android/app/build.gradle)"
          test -n "$code" && test -n "$version"
          name="Yebo-${version}-trial.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "artifacts/$name"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "artifacts/$name" > artifacts/signature-verification.txt
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          "$aapt" dump badging "artifacts/$name" > artifacts/apk-metadata.txt
          grep -Fq "package: name='com.jlmac.campingmap.baidutrial' versionCode='$code' versionName='$version'" artifacts/apk-metadata.txt
          grep -Fxq "application-label:'野泊百度验证版'" artifacts/apk-metadata.txt
          grep -Fq "launchable-activity: name='com.jlmac.campingmap.MainActivity'" artifacts/apk-metadata.txt
          "$aapt" dump xmltree "artifacts/$name" --file AndroidManifest.xml > "$RUNNER_TEMP/camping-manifest.txt"
          grep -Fq 'com.jlmac.campingmap.baidutrial.fileprovider' "$RUNNER_TEMP/camping-manifest.txt"
          # AAPT2 and signature verification can succeed on APKs Android refuses to parse.
          grep -Fq '=":baidu_poi_resolver"' "$RUNNER_TEMP/camping-manifest.txt"
          if grep -Eq 'process\([^)]*\)=":[^"]*-' "$RUNNER_TEMP/camping-manifest.txt"; then
            echo "::error::Invalid hyphen in a packaged private Android process name"
            exit 1
          fi
          "$aapt" dump resources "artifacts/$name" > "$RUNNER_TEMP/camping-resources.txt"
          grep -E '(mipmap/ic_launcher|drawable/ic_launcher_monochrome)' "$RUNNER_TEMP/camping-resources.txt" > artifacts/launcher-resources.txt
          grep -q 'mipmap/ic_launcher_round' artifacts/launcher-resources.txt
          grep -q 'drawable/ic_launcher_monochrome' artifacts/launcher-resources.txt
          cd artifacts
          sha256sum "$name" > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: yebo-android-trial
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
  installed-apk:
    if: github.ref == 'refs/heads/feat/coordinate-navigation'
    needs: build
    uses: ./.github/workflows/android-smoke.yml
