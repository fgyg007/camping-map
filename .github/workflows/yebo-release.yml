name: 野泊 Android release
on:
  push:
    branches: ['release/yebo-1.0.0']
    tags: ['v1.0.0']
permissions:
  contents: read
concurrency:
  group: yebo-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - run: npm ci && npm test && npm run build
      - name: Verify mobile layout and data flows
        run: |
          tool_dir="$RUNNER_TEMP/yebo-browser"
          npm install --prefix "$tool_dir" --no-audit --no-fund --no-package-lock playwright@1.65.1
          "$tool_dir/node_modules/.bin/playwright" install chromium
          npm run dev -- --host 127.0.0.1 --port 5179 --strictPort > "$RUNNER_TEMP/yebo-vite.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for n in {1..20}; do curl -fs http://127.0.0.1:5179 > /dev/null && break; sleep 1; done
          CAMPING_PLAYWRIGHT="$tool_dir/node_modules/playwright" node tests/save-home.smoke.cjs
      - run: npx cap sync android
      - name: Compile and check release variant without signing credentials
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease lintRelease testReleaseUnitTest --no-daemon
      - name: Validate release metadata
        run: |
          chmod +x tools/check-release-apk.sh
          tools/check-release-apk.sh android/app/build/outputs/apk/release/app-release-unsigned.apk
          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify android/app/build/outputs/apk/release/app-release-unsigned.apk > /dev/null 2>&1; then
            echo "::error::Expected the candidate to be unsigned."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: yebo-release-unsigned-internal
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 3
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: yebo-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with:
          name: yebo-release-unsigned-internal
          path: unsigned
      - name: Sign and pin the project owner's release certificate
        env:
          YEBO_KEYSTORE: ${{ secrets.YEBO_KEYSTORE_BASE64 }}
          YEBO_STOREPASS: ${{ secrets.YEBO_STORE_PASSWORD }}
          YEBO_KEYPASS: ${{ secrets.YEBO_KEY_PASSWORD }}
          YEBO_ALIAS: ${{ vars.YEBO_KEY_ALIAS }}
          YEBO_CERT_SHA256: ${{ vars.YEBO_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in YEBO_KEYSTORE YEBO_STOREPASS YEBO_KEYPASS YEBO_ALIAS YEBO_CERT_SHA256; do
            if [ -z "${!name}" ]; then echo "::error::Missing release signing configuration: $name"; exit 1; fi
          done
          [[ "$YEBO_CERT_SHA256" =~ ^[A-Fa-f0-9]{64}$ ]]
          version="$(awk -F'"' '/^[[:space:]]*versionName "[0-9.]+"/ {print $2}' android/app/build.gradle)"
          test "$GITHUB_REF_NAME" = "v$version"
          umask 077
          keystore="$(mktemp "$RUNNER_TEMP/yebo-key.XXXXXXXX")"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$YEBO_KEYSTORE" | base64 --decode > "$keystore"
          unset YEBO_KEYSTORE
          bt="$ANDROID_HOME/build-tools/36.0.0"
          mkdir signed
          "$bt/zipalign" -f -P 16 4 unsigned/app-release-unsigned.apk "$RUNNER_TEMP/yebo-aligned.apk"
          "$bt/apksigner" sign --ks "$keystore" --ks-key-alias "$YEBO_ALIAS" \
            --ks-pass env:YEBO_STOREPASS --key-pass env:YEBO_KEYPASS \
            --out "signed/Yebo-$version.apk" "$RUNNER_TEMP/yebo-aligned.apk"
          "$bt/zipalign" -c -P 16 4 "signed/Yebo-$version.apk"
          "$bt/apksigner" verify --verbose --print-certs "signed/Yebo-$version.apk" > signed/signature.txt
          cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' signed/signature.txt)"
          test "${cert,,}" = "${YEBO_CERT_SHA256,,}"
          bash tools/check-release-apk.sh "signed/Yebo-$version.apk"
          (cd signed && sha256sum "Yebo-$version.apk" > SHA256SUMS.txt)
      - name: Publish signed APK to this repository only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" signed/*.apk signed/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "野泊 ${GITHUB_REF_NAME#v}" \
            --notes-file docs/YEBO-1.0.0.md
